# pnpm 11 key. Nothing here needs a postinstall build: sharp and unrs-resolver
# ship prebuilt binaries, msw is a dev-only transitive dependency of vitest.
allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
# pnpm 10 equivalent, kept so an older pnpm (e.g. on a build host) behaves the same.
ignoredBuiltDependencies:
  - msw
  - sharp
  - unrs-resolver

# Patch vulnerable transitive releases without widening their minor versions.
overrides:
  'browserslist@<4.28.7': 4.28.7
  '@babel/core@>=7.0.0 <7.29.6': 7.29.6
  'fflate@>=0.8.0 <0.8.3': 0.8.3
  'fflate@>=0.6.0 <0.6.11': 0.6.11
